<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Распродажи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Каталог склада распродаж, Донецк</title>
<meta name="description" content="Поиск по товарам склада распродаж в Донецке: техника, посуда, инструмент, детское. Цены, акции, фото.">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mute:#7a766d;--line:#e4e0d6;--acc:#d9482b;--acc2:#1f6f54;--chip:#ece8dd;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--card:#1e1c17;--ink:#f1ede3;--mute:#9a9588;--line:#2e2b24;--acc:#ff7a59;--acc2:#4fc79c;--chip:#2a2720;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:12px 0}
h1{font-size:18px;margin:0;white-space:nowrap;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.search{flex:1;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--mute)}
.bar{display:flex;gap:8px;align-items:center;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid transparent;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{font-weight:600;color:var(--mute);margin-left:4px;font-size:12px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.on b{color:inherit;opacity:.7}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 0 4px;color:var(--mute);font-size:13px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.tools input[type=number],.tools select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.tools input[type=number]{width:84px}
.spacer{flex:1}
.count{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:12px 0 40px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;border:1px solid var(--line);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.ph{aspect-ratio:1/1;background:var(--chip);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;background:var(--acc);color:#fff}
.tag.g{background:var(--acc2)}
.tag.n{background:var(--ink);color:var(--bg)}
.tag.m{background:var(--mute)}
.card.stale .ph img{opacity:.72}
.card.gone .ph img{filter:grayscale(1);opacity:.5}
.card.gone .price{text-decoration:line-through;color:var(--mute)}
.note{font-size:13px;padding:9px 11px;border-radius:10px;background:var(--chip);color:var(--ink)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{font-size:13px;font-weight:400;color:var(--mute);margin-left:6px}
.ttl{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.meta{margin-top:auto;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.empty{text-align:center;color:var(--mute);padding:80px 0}
#more{height:1px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb.on{display:flex}
.lbc{background:var(--card);border-radius:18px;max-width:880px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.lbc img{width:100%;height:100%;object-fit:contain;background:var(--chip);max-height:92vh}
.lbi{padding:22px;display:flex;flex-direction:column;gap:12px}
.lbi h2{margin:0;font-size:18px;line-height:1.3}
.lbi .price{font-size:30px}
.lbi dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--mute)}
.lbi dd{margin:0;color:var(--ink)}
.btn{display:inline-block;padding:11px 16px;border-radius:11px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;text-align:center;margin-top:auto}
.pickup{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;background:color-mix(in srgb,var(--chip) 55%,transparent)}
.pickup h3{margin:0;font-size:14px}
.pickup ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pickup a{color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap}
.pickup .st{font-weight:600}
.pickup .st.on{color:var(--acc2)}
.pickup .st.off{color:var(--mute)}
.pickup small{color:var(--mute);font-size:12px;line-height:1.35}
.acts{display:flex;gap:8px;margin-top:auto}
.acts .btn{flex:1;margin-top:0}
.btn.sec{background:var(--chip);color:var(--ink)}
.x{position:absolute;right:20px;top:14px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}
.prow{display:contents}
.tabs,.back,.sheet-h,.sheet-apply,.mline{display:none}
@media (max-width:720px){
 :root{--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--tab:58px}
 html{overscroll-behavior-y:none}
 body{padding-bottom:calc(var(--tab) + var(--sb));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
 input,select{-webkit-user-select:text;user-select:text}
 .wrap{padding:0 12px}
 header{padding-top:var(--st);border-bottom:0}
 .top{padding:10px 0 8px}
 h1{display:none}
 .search input{padding:12px 14px 12px 40px;border-radius:14px;border-color:transparent;background:var(--chip)}
 .search input:focus{background:var(--card)}
 .bar{padding:0 12px 10px;margin:0 -12px;scroll-snap-type:x proximity}
 .chip{scroll-snap-align:start;padding:8px 13px;font-size:13.5px}
 .chip:active{transform:scale(.96)}
 .mline{display:flex;justify-content:space-between;padding:2px 2px 0;font-size:12px;color:var(--mute)}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 24px}
 .card{border:0;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .12s}
 .card:hover{transform:none}
 .card:active{transform:scale(.97)}
 .info{padding:8px 10px 10px;gap:4px}
 .price{font-size:17px}
 .ttl{font-size:13px;-webkit-line-clamp:2;line-height:1.3}
 .meta span:first-child{display:none}
 .meta{justify-content:flex-end}
 .tags{left:6px;top:6px;gap:4px}
 .tag{font-size:10px;padding:2px 6px;border-radius:6px}
 .empty{padding:60px 16px}
 /* нижняя панель вкладок */
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
 .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:500;position:relative;cursor:pointer}
 .tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
 .tabs button.on{color:var(--acc)}
 .tabs button:active svg{transform:scale(.88)}
 .tabs .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 4px}
 .tabs .badge:empty{display:none}
 /* фильтры: выезжающий лист */
 .back{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
 body.layer .back{opacity:1;pointer-events:auto}
 .tools{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:22px 22px 0 0;padding:6px 16px calc(14px + var(--sb));flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:0;max-height:88vh;max-height:88dvh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);color:var(--ink);font-size:15px}
 body.sheet .tools{transform:none}
 .tools::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
 .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;font-size:18px}
 .sheet-x{border:0;background:var(--chip);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:32px;cursor:pointer}
 .tools>span:first-of-type{padding:8px 0 4px;font-size:13px;color:var(--mute)}
 .prow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
 .tools input[type=number]{width:100%;padding:12px;font-size:16px;border-radius:12px}
 .tools label{padding:13px 0;border-top:1px solid var(--line);justify-content:space-between;flex-direction:row-reverse;font-size:15px}
 .tools label input{width:22px;height:22px;accent-color:var(--acc)}
 .tools .spacer,.tools .count{display:none}
 .tools select{margin-top:10px;padding:13px;font-size:16px;border-radius:12px}
 .sheet-apply{display:block;margin-top:14px;border:0;font:inherit;font-size:16px;cursor:pointer;padding:14px}
 /* карточка товара: нижний лист */
 .lb{padding:0;align-items:flex-end;background:rgba(0,0,0,.5);transition:background .2s}
 .lbc{grid-template-columns:1fr;border-radius:22px 22px 0 0;max-height:90vh;max-height:90dvh;animation:up .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain;grid-auto-rows:min-content}
 @keyframes up{from{transform:translateY(100%)}}
 .lbc::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px;position:sticky;top:8px;z-index:2}
 .lbc img{max-height:44vh;max-height:44dvh;height:auto;object-fit:contain}
 .lbi{padding:14px 16px calc(14px + var(--sb));gap:10px}
 .lbi h2{font-size:16px}
 .lbi .price{font-size:28px}
 .acts{position:sticky;bottom:calc(var(--sb) + 4px);margin-top:6px}
 .lbi .btn{padding:14px;font-size:15px}
 .x{position:fixed;right:12px;top:calc(var(--st) + 10px);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);font-size:22px;line-height:36px;padding:0;text-align:center}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
   <h1>Распродажи<small id="upd"></small></h1>
   <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <input id="q" type="search" placeholder="Поиск: пылесос, Polaris, кастрюля..." autocomplete="off"></div>
  </div>
  <div class="bar" id="cats"></div>
  <div class="mline"><span id="cnt2"></span><span id="upd2"></span></div>
 </div>
</header>
<main class="wrap">
 <div class="tools" id="sheet">
  <div class="sheet-h"><b>Фильтры</b><button class="sheet-x" id="shx" aria-label="Закрыть">×</button></div>
  <span>Цена, ₽</span><div class="prow"><input id="pmin" type="number" min="0" inputmode="numeric" placeholder="от"><input id="pmax" type="number" min="0" inputmode="numeric" placeholder="до"></div>
  <label><input id="fnew" type="checkbox"> за 7 дней</label>
  <label><input id="fpromo" type="checkbox"> акции</label>
  <label><input id="fdrop" type="checkbox"> подешевело</label>
  <label><input id="fused" type="checkbox"> без Б/У</label>
  <label><input id="fstale" type="checkbox"> без давних</label>
  <label><input id="fgone" type="checkbox"> показать снятые</label>
  <span class="spacer"></span>
  <span class="count" id="cnt"></span>
  <select id="sort"><option value="new">Сначала новые</option><option value="pa">Дешевле</option><option value="pd">Дороже</option></select>
  <button class="btn sheet-apply" id="sha">Показать</button>
 </div>
 <div class="grid" id="grid"></div>
 <div class="empty" id="empty" hidden>Ничего не нашлось. Попробуйте другое слово или сбросьте фильтры.</div>
 <div id="more"></div>
</main>
<div class="back" id="back"></div>
<nav class="tabs" aria-label="Разделы">
 <button id="tCat" class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>Каталог</button>
 <button id="tNew"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Новое</button>
 <button id="tPromo"><svg viewBox="0 0 24 24"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.2"/></svg>Акции</button>
 <button id="tFil"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Фильтры<span class="badge" id="fbadge"></span></button>
</nav>
<div class="lb" id="lb"><button class="x" id="lbx" aria-label="Закрыть">×</button><div class="lbc" id="lbc"></div></div>
<script src="data.js"></script>
<script>
const D=window.CATALOG, ITEMS=D.items, NOW=new Date(D.meta.updated).getTime();
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
ITEMS.forEach(i=>{i._s=norm(i.title+' '+i.cat);i._t=new Date(i.date).getTime()});
const fmt=n=>n==null?'цена в посте':n.toLocaleString('ru-RU')+' ₽';
const dayAgo=t=>{const d=Math.floor((NOW-t)/864e5);return d<=0?'сегодня':d===1?'вчера':d+' дн. назад'};
let cat='',shown=0,list=[];
const PAGE=48;
$('upd').textContent=$('upd2').textContent='обновлено '+new Date(D.meta.updated).toLocaleDateString('ru-RU');
function lemma(w){return w.replace(/(ами|ями|ов|ев|ей|ом|ем|ах|ях|ые|ие|ой|ый|ий|ая|яя|ое|ее|ую|юю|ы|и|а|я|у|ю|е|о)$/,'')}
function filter(){
 const words=norm($('q').value).split(/\s+/).filter(Boolean).map(w=>w.length>4?lemma(w):w);
 const pmin=+$('pmin').value||0,pmax=+$('pmax').value||Infinity;
 const fnew=$('fnew').checked,fpromo=$('fpromo').checked,fdrop=$('fdrop').checked,fused=$('fused').checked,fstale=$('fstale').checked;
 list=ITEMS.filter(i=>{
  if(i.gone&&!$('fgone').checked)return false;
  if(fstale&&i.stale)return false;
  if(cat&&i.cat!==cat)return false;
  if(words.length&&!words.every(w=>i._s.includes(w)))return false;
  if(i.price!=null&&(i.price<pmin||i.price>pmax))return false;
  if(i.price==null&&(pmin||pmax<Infinity))return false;
  if(fnew&&NOW-i._t>7*864e5)return false;
  if(fpromo&&!i.promo)return false;
  if(fdrop&&!(i.price_prev&&i.price&&i.price<i.price_prev))return false;
  if(fused&&i.used)return false;
  return true});
 const s=$('sort').value;
 if(s==='pa')list.sort((a,b)=>(a.price??1e12)-(b.price??1e12));
 else if(s==='pd')list.sort((a,b)=>(b.price??-1)-(a.price??-1));
 else list.sort((a,b)=>b.id-a.id);
 const cnt=list.length.toLocaleString('ru-RU')+' товаров';$('cnt').textContent=cnt;$('cnt2').textContent=cnt;$('sha').textContent='Показать '+cnt;
 syncUI();
 $('grid').innerHTML='';shown=0;$('empty').hidden=list.length>0;more();
}
function card(i){
 const el=document.createElement('div');el.className='card'+(i.gone?' gone':i.stale?' stale':'');
 const tags=(i.gone?'<span class="tag n">снят</span>':'')+(i.promo?'<span class="tag">акция</span>':'')+(i.promo_ended?'<span class="tag m">акция закончилась</span>':'')+(i.stale?'<span class="tag m">давно висит</span>':'')+(i.used?'<span class="tag n">Б/У</span>':'')+((i.price_prev&&i.price&&i.price<i.price_prev)?'<span class="tag g">подешевело</span>':'');
 el.innerHTML=`<div class="ph"><img loading="lazy" src="${i.img}" alt=""><div class="tags">${tags}</div></div>
 <div class="info"><div class="price">${fmt(i.price)}${i.price_prev&&i.price&&i.price!==i.price_prev?`<s>${fmt(i.price_prev)}</s>`:''}</div>
 <div class="ttl"></div><div class="meta"><span>${i.cat}</span><span>${dayAgo(i._t)}</span></div></div>`;
 el.querySelector('.ttl').textContent=i.title;
 el.onclick=()=>open(i);return el}
function more(){const f=document.createDocumentFragment();list.slice(shown,shown+PAGE).forEach(i=>f.appendChild(card(i)));shown+=PAGE;$('grid').appendChild(f)}
function note(i){
 if(i.gone)return `<div class="note">Пост удалён из канала ${new Date(i.gone_at).toLocaleDateString('ru-RU')}, товар скорее всего продан.</div>`;
 const n=[];
 if(i.promo_ended)n.push('Акция закончилась, цена в посте могла измениться.');
 if(i.stale)n.push('Пост висит больше 14 дней. Лучше уточнить наличие до поездки.');
 return n.length?`<div class="note">${n.join(' ')}</div>`:'';
}
const SHOP={tel:'+79498269381',telView:'+7 (949) 826-93-81',addr:'проспект Павших Коммунаров 188б, Донецк',hint:'на Яндекс Картах: «металобаза Альянс решений»',
 map:'https://yandex.ru/maps/?text='+encodeURIComponent('Донецк, проспект Павших Коммунаров 188б'),hours:{wd:[10,17],we:[10,15]}};
function shopState(){
 const p=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',weekday:'short',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date());
 const g=t=>p.find(x=>x.type===t).value,dayN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),t=+g('hour')+(+g('minute'))/60;
 const hrs=d=>(d===0||d===6)?SHOP.hours.we:SHOP.hours.wd;
 const [o,c]=hrs(dayN);
 if(t>=o&&t<c)return{on:true,text:`Сейчас открыто, до ${c}:00`};
 if(t<o)return{on:false,text:`Сейчас закрыто, откроется сегодня в ${o}:00`};
 const nd=(dayN+1)%7;return{on:false,text:`Сейчас закрыто, откроется завтра в ${hrs(nd)[0]}:00`}}
function pickup(i){
 if(i.gone)return `<div class="pickup"><h3>Хотите похожий товар?</h3><div>Позвоните на склад: <a href="tel:${SHOP.tel}">${SHOP.telView}</a></div></div>`;
 const st=shopState();
 return `<div class="pickup"><h3>Как забрать товар</h3><ol>
 <li>Позвоните <a href="tel:${SHOP.tel}">${SHOP.telView}</a>, назовите товар и цену и уточните, что он на месте и можно ли отложить.</li>
 <li>Приезжайте на склад: ${SHOP.addr} (${SHOP.hint}). <a target="_blank" rel="noopener" href="${SHOP.map}">Маршрут</a></li>
 <li>Режим: пн-пт 10:00-17:00, сб-вс 10:00-15:00. <span class="st ${st.on?'on':'off'}">${st.text}</span></li></ol>
 <small>График меняется из-за поставок. Оплату и доставку уточняйте по телефону.</small></div>`}
var open=function(i){
 const c=$('lbc');c.innerHTML=`<img src="${i.img}" alt=""><div class="lbi"><h2></h2><div class="price">${fmt(i.price)}</div><dl>
 <dt>Категория</dt><dd>${i.cat}</dd><dt>Выложен</dt><dd>${new Date(i.date).toLocaleDateString('ru-RU')} (${dayAgo(i._t)})</dd>
 ${i.reposts?`<dt>Повторов</dt><dd>${i.reposts}, впервые ${new Date(i.first_seen).toLocaleDateString('ru-RU')}</dd>`:''}
 ${i.price_prev?`<dt>Была цена</dt><dd>${fmt(i.price_prev)}</dd>`:''}</dl>${note(i)}${pickup(i)}
 <div class="acts"><a class="btn" href="tel:${SHOP.tel}">Позвонить</a>${i.gone?'':`<a class="btn sec" target="_blank" rel="noopener" href="https://t.me/${D.meta.channel}/${i.id}">Пост в Telegram</a>`}</div></div>`;
 c.querySelector('h2').textContent=i.title;$('lb').classList.add('on')};
/* слои (карточка товара, фильтры): кнопка Назад на телефоне закрывает слой, а не уходит со страницы */
let layer=null;
function pushLayer(n){layer=n;history.pushState({o:1},'')}
function dropLayer(){$('lb').classList.remove('on');document.body.classList.remove('sheet','layer');layer=null;$('lbc').style.transform=''}
function close(){if(!layer)return;dropLayer();if(history.state&&history.state.o)history.back()}
window.addEventListener('popstate',()=>{if(layer)dropLayer()});
$('lbx').onclick=close;$('lb').onclick=e=>{if(e.target===$('lb'))close()};document.addEventListener('keydown',e=>e.key==='Escape'&&close());
const _open=open;open=function(i){_open(i);pushLayer('lb')};
function openSheet(){document.body.classList.add('sheet','layer');pushLayer('sheet')}
$('tFil').onclick=openSheet;$('shx').onclick=close;$('sha').onclick=close;$('back').onclick=close;
/* свайп вниз закрывает карточку товара */
(()=>{const c=$('lbc');let y0=null,dy=0;
 c.addEventListener('touchstart',e=>{y0=c.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
 c.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){c.style.transition='none';c.style.transform=`translateY(${dy}px)`}},{passive:true});
 c.addEventListener('touchend',()=>{if(y0==null)return;c.style.transition='transform .2s';if(dy>110)close();else c.style.transform='';y0=null;dy=0});
})();
/* вкладки */
const quick=()=>$('fnew').checked||$('fpromo').checked;
$('tCat').onclick=()=>{if(!quick()&&!cat&&!$('q').value){scrollTo({top:0,behavior:'smooth'});return}
 $('fnew').checked=$('fpromo').checked=false;cat='';$('q').value='';chips();filter();scrollTo({top:0})};
$('tNew').onclick=()=>{$('fnew').checked=!$('fnew').checked;filter();scrollTo({top:0})};
$('tPromo').onclick=()=>{$('fpromo').checked=!$('fpromo').checked;filter();scrollTo({top:0})};
function syncUI(){
 $('tNew').classList.toggle('on',$('fnew').checked);$('tPromo').classList.toggle('on',$('fpromo').checked);
 $('tCat').classList.toggle('on',!quick());
 const n=($('pmin').value||$('pmax').value?1:0)+['fdrop','fused','fstale','fgone'].filter(id=>$(id).checked).length+($('sort').value!=='new'?1:0);
 $('fbadge').textContent=n||'';$('tFil').classList.toggle('on',n>0)}
function chips(){ $('cats').innerHTML='';
 const base=ITEMS.filter(i=>!i.gone||$('fgone').checked),cc={};base.forEach(i=>cc[i.cat]=(cc[i.cat]||0)+1);
 const names=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]);
 [['','Все',base.length],...names.map(n=>[n,n,cc[n]])].forEach(([v,t,n])=>{
  const b=document.createElement('button');b.className='chip'+(cat===v?' on':'');b.innerHTML=`${t}<b>${n}</b>`;
  b.onclick=()=>{cat=v;chips();filter()};$('cats').appendChild(b)})}
chips();
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(filter,120)};
['pmin','pmax','fnew','fpromo','fdrop','fused','fstale','sort'].forEach(id=>$(id).addEventListener('input',filter));
$('fgone').addEventListener('input',()=>{chips();filter()});
new IntersectionObserver(e=>{if(e[0].isIntersecting&&shown<list.length)more()},{rootMargin:'600px'}).observe($('more'));
filter();
</script>
</body>
</html>
